# HTTP phase (IP + domain before SSL).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream svbeauty_app {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name svbeauty.com.ua www.svbeauty.com.ua 201.79.15.126 _;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* ^/media/.*\.(?:php|py|pl|cgi|sh)$ {
        deny all;
    }

    location / {
        proxy_pass http://svbeauty_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 20s;
    }
}
