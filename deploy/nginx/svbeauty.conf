upstream svbeauty_app {
    server web:8000;
}

server {
    listen 80;
    server_name svbeauty.com.ua www.svbeauty.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name svbeauty.com.ua www.svbeauty.com.ua;

    ssl_certificate /etc/letsencrypt/live/svbeauty.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/svbeauty.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* ^/media/.*\.(?:php|py|pl|cgi|sh)$ {
        deny all;
    }

    location / {
        proxy_pass http://svbeauty_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
