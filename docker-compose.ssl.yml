# Overlay after certbot. Uses deploy/nginx/docker.prod.conf (svbeauty.com.ua).
services:
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - ./deploy/nginx/docker.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
