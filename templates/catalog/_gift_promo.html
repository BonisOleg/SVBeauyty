{% load i18n %}
{% if product.has_gift_promo %}
  <aside
    class="gift-promo"
    style="--gift-accent: {{ site_settings.accent_color|default:'#20847C' }}"
    data-gift-promo
  >
    <div class="gift-promo__head">
      <span class="gift-promo__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M2 7h20v5H2V7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M12 7v14M12 7c0-2 1.5-3.5 3.2-3.5S18 5.5 18 7M12 7c0-2-1.5-3.5-3.2-3.5S6 5.5 6 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </span>
      <p class="gift-promo__title">{{ product.gift_promo_title }}</p>
      {% if product.gift_promo_tooltip %}
        <button
          type="button"
          class="gift-promo__info"
          data-gift-promo-info
          aria-expanded="false"
          aria-controls="gift-promo-tip-{{ product.id }}"
          aria-label="{% translate 'Деталі акції' %}"
        >
          <span aria-hidden="true">i</span>
        </button>
      {% endif %}
    </div>
    <p class="gift-promo__text">{{ product.gift_promo_text|linebreaksbr }}</p>
    {% if product.gift_promo_tooltip %}
      <div
        class="gift-promo__tooltip"
        id="gift-promo-tip-{{ product.id }}"
        role="tooltip"
        hidden
        data-gift-promo-tooltip
      >
        {{ product.gift_promo_tooltip|linebreaksbr }}
      </div>
    {% endif %}
  </aside>
{% endif %}
