{% load i18n catalog_tags %}
{% if products %}
  <section class="pdp-carousel" data-carousel>
    <div class="pdp-carousel__head">
      <h2 class="pdp-carousel__title">{{ title }}</h2>
      <div class="pdp-carousel__nav" data-carousel-nav aria-label="{% translate 'Навігація слайдера' %}">
        <button type="button" class="pdp-carousel__btn pdp-carousel__btn--prev" data-carousel-prev aria-label="{% translate 'Назад' %}">
          <svg width="28" height="12" viewBox="0 0 28 12" fill="none" aria-hidden="true">
            <path d="M27 6H2M7 1L2 6l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </button>
        <button type="button" class="pdp-carousel__btn pdp-carousel__btn--next" data-carousel-next aria-label="{% translate 'Далі' %}">
          <svg width="28" height="12" viewBox="0 0 28 12" fill="none" aria-hidden="true">
            <path d="M1 6h25M21 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </button>
      </div>
      <div class="pdp-carousel__dots" data-carousel-dots hidden aria-hidden="true"></div>
    </div>
    <div class="pdp-carousel__track" data-carousel-track>
      {% for item in products %}
        <div class="pdp-carousel__slide">
          {% product_card item %}
        </div>
      {% endfor %}
    </div>
  </section>
{% endif %}
