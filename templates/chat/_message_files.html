{% for item in message.attachments.all %}
  <button type="button" class="chat__file{% if item.kind == 'pdf' %} chat__file--pdf{% endif %}"
    data-chat-preview data-preview-url="{% url 'chat:file' item.public_id %}"
    data-preview-name="{{ item.original_name }}" data-preview-kind="{{ item.kind }}">
    {% if item.kind == "image" %}
      <img src="{% url 'chat:file' item.public_id %}" alt="{{ item.original_name }}" width="160" height="120">
    {% else %}
      {{ item.original_name }}
    {% endif %}
  </button>
{% endfor %}
