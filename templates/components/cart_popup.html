{% load i18n %}
<div class="cart-popup" data-cart-popup aria-hidden="true">
  <div class="cart-popup__overlay" data-cart-overlay></div>
  <div class="cart-popup__panel" role="dialog" aria-modal="true" aria-label="{% translate 'Кошик' %}">
    <div class="cart-popup__head">
      <span class="cart-popup__title">{% translate "Кошик" %}</span>
      <button type="button" class="icon-btn" data-cart-close aria-label="{% translate 'Закрити' %}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="cart-popup__body" id="cart-popup-body" data-cart-popup-body>
      <p class="chat__intro">{% translate "Кошик порожній." %}</p>
    </div>

    <div class="cart-popup__foot">
      <a href="{% url 'commerce:cart' %}" class="btn btn--outline btn--block">{% translate "Перейти в кошик" %}</a>
      <a href="{% url 'commerce:checkout' %}" class="btn btn--primary btn--block">{% translate "Оформити замовлення" %}</a>
    </div>
  </div>
</div>
