{% load i18n %}
<div class="chat" id="live-chat" data-chat
     data-chat-history-url="{% url 'chat:history' %}"
     data-chat-send-url="{% url 'chat:send' %}"
     data-chat-error-text="{% translate 'Не вдалось надіслати. Спробуйте ще раз.' %}">

  <div class="chat__panel" id="live-chat-panel" role="dialog" aria-label="{% translate 'Чат з менеджером' %}">
    <div class="chat__head">
      <div>
        <p class="chat__title">{% translate "Онлайн-консультант" %}</p>
        <p class="chat__subtitle">{% translate "Відповідаємо у робочі години" %}</p>
      </div>
      <button type="button" class="chat__close" data-chat-close aria-label="{% translate 'Закрити' %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="chat__body" id="chat-messages" data-chat-body>
      <p class="chat__intro">{% translate "Вітаємо! Напишіть питання — менеджер відповість найближчим часом." %}</p>
    </div>

    <form class="chat__form"
          data-chat-form
          data-qa="chat-form"
          hx-post="{% url 'chat:send' %}"
          hx-target="#chat-messages"
          hx-swap="beforeend"
          hx-disabled-elt="button[type=submit]">
      {% csrf_token %}
      {% if not user.is_authenticated %}
        <div class="chat__lead">
          <input type="text" name="name" data-chat-name placeholder="{% translate 'Ваше імʼя' %}" autocomplete="name">
          <input type="tel" name="phone" data-chat-phone placeholder="{% translate 'Телефон' %}" autocomplete="tel" inputmode="tel">
        </div>
      {% endif %}
      <p class="chat__error" data-chat-error role="alert"></p>
      <div class="chat__row">
        <input type="text"
               class="chat__input"
               name="text"
               data-chat-input
               data-qa="chat-input"
               placeholder="{% translate 'Ваше повідомлення' %}"
               autocomplete="off"
               required>
        <button type="submit" class="chat__send" data-qa="chat-send" aria-label="{% translate 'Надіслати' %}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 12 20 4l-8 16-2-6-6-2Z" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <button type="button" class="chat__toggle" data-chat-toggle data-qa="chat-toggle" aria-label="{% translate 'Чат з менеджером' %}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <path d="M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.4 0-2.7-.3-3.9-.9L3 21l1.5-5.1A8.4 8.4 0 0 1 3.5 12 8.5 8.5 0 1 1 21 12z" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/>
    </svg>
  </button>
</div>
