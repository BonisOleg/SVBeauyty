{% load i18n static %}
<div class="chat" id="live-chat" data-chat data-chat-history-url="{% url 'chat:history' %}"
  data-chat-send-url="{% url 'chat:send' %}"
  data-chat-error-text="{% translate 'Не вдалось надіслати. Спробуйте ще раз.' %}"
  data-chat-contacts-error="{% translate 'Вкажіть імʼя та телефон перед першим повідомленням.' %}">

  <div class="chat__panel" id="live-chat-panel" role="dialog" aria-label="{% translate 'Чат з менеджером' %}">
    <div class="chat__head">
      <div>
        <p class="chat__title">{% translate "Онлайн-консультант" %}</p>
        <p class="chat__subtitle">{% translate "Відповідаємо у робочі години" %}</p>
      </div>
      <button type="button" class="chat__close" data-chat-close aria-label="{% translate 'Закрити' %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="chat__body" id="chat-messages" data-chat-body>
      <p class="chat__intro">{% translate "Вітаємо! Напишіть питання — менеджер відповість найближчим часом." %}</p>
    </div>

    <form class="chat__form" data-chat-form data-qa="chat-form" hx-post="{% url 'chat:send' %}"
      hx-target="#chat-messages" hx-swap="beforeend" hx-disabled-elt="button[type=submit]">
      {% csrf_token %}
      {% if not user.is_authenticated %}
      <div class="chat__lead" data-chat-lead>
        <input type="text" name="name" data-chat-name required
               placeholder="{% translate 'Ваше імʼя' %}" autocomplete="name">
        <input type="tel" name="phone" data-chat-phone required
               placeholder="{% translate 'Телефон' %}" autocomplete="tel" inputmode="tel">
      </div>
      {% endif %}
      <p class="chat__error" data-chat-error role="alert"></p>
      <div class="chat__row">
        <input type="text" class="chat__input" name="text" data-chat-input data-qa="chat-input"
          placeholder="{% translate 'Ваше повідомлення' %}" autocomplete="off" required>
        <button type="submit" class="chat__send" data-qa="chat-send" aria-label="{% translate 'Надіслати' %}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            aria-hidden="true">
            <path d="M4 12 20 4l-8 16-2-6-6-2Z" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </form>
  </div>

  <button type="button" class="chat__toggle" data-chat-toggle data-qa="chat-toggle"
    aria-label="{% translate 'Чат з менеджером' %}">
    <span class="chat__toggle-ring" aria-hidden="true"></span>
    <span class="chat__toggle-ring chat__toggle-ring--delay" aria-hidden="true"></span>
    <span class="chat__toggle-face" aria-hidden="true">
      {% if site_settings.logo %}
        <img class="chat__toggle-logo" src="{{ site_settings.logo.url }}" alt="" width="56" height="56">
      {% else %}
        <img class="chat__toggle-logo" src="{% static 'images/logo.png' %}" alt="" width="56" height="56">
      {% endif %}
    </span>
  </button>
</div>
