{% extends "base.html" %}
{% load i18n %}

{% block title %}404 — {{ site_settings.site_name }}{% endblock %}

{% block content %}
  <div class="thanks">
    <h1 class="page-title">{% translate "Сторінку не знайдено" %}</h1>
    <p class="form-note">{% translate "Можливо, посилання застаріло або товар більше не продається." %}</p>
    <p style="margin-top: var(--sp-5)">
      <a href="{% url 'catalog:catalog' %}" class="btn btn--primary">{% translate "До каталогу" %}</a>
    </p>
  </div>
{% endblock %}
